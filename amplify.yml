version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --no-optional
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=0, must-revalidate'
        - key: 'Content-Security-Policy'
          value: "default-src 'self'; connect-src 'self' http://44.204.26.211:5000 ws:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:;"
        - key: 'Upgrade-Insecure-Requests'
          value: '1'
    - pattern: 'static/**/*'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'
  environment:
    variables:
      # Direct EC2 URL to avoid mixed content issues
      BACKEND_URL: http://44.204.26.211:5000
      NEXT_PUBLIC_BACKEND_URL: http://44.204.26.211:5000
      NEXT_PUBLIC_API_URL: http://44.204.26.211:5000
      NEXT_PUBLIC_APP_URL: https://deployment.d2cb7n4tfzbtvj.amplifyapp.com
      NEXT_BUILD_SKIP_TYPECHECKING: 1
      NEXT_BUILD_IGNORE_TYPESCRIPT_ERRORS: 1

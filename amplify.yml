version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --no-optional
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=0, must-revalidate'
    - pattern: 'static/**/*'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'
  environment:
    variables:
      BACKEND_URL: /backend
      NEXT_PUBLIC_BACKEND_URL: /backend
      NEXT_PUBLIC_API_URL: /backend
      NEXT_PUBLIC_APP_URL: https://master.d2cb7n4tfzbtvj.amplifyapp.com
      NEXT_BUILD_SKIP_TYPECHECKING: 1
      NEXT_BUILD_IGNORE_TYPESCRIPT_ERRORS: 1

spring.application.name=teashop-backend

# Production-level logging (reduce verbosity compared to dev)
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.com.teashop.teashop_backend=INFO
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false

# Database Configuration - these values will be set through environment variables
spring.datasource.url=${RDS_JDBC_URL}
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=none
spring.datasource.hikari.maximum-pool-size=10

# Security configuration
spring.security.filter.order=10
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=3600000

# Resend configuration
resend.api-key=${RESEND_API_KEY}

# Server configuration
server.port=5000

# Frontend URL for email links
frontend.url=${FRONTEND_URL}

# Disable dev tools in production
spring.devtools.add-properties=false
spring.devtools.restart.enabled=false

# Basic health endpoint for AWS health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
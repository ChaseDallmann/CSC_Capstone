version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21
      nodejs: 20
  pre_build:
    commands:
      - echo Pre-build started on `date`
      - npm ci
  build:
    commands:
      - echo Build started on `date`
      - mvn clean package -DskipTests
      - npm run build
  post_build:
    commands:
      - echo Build completed on `date`

artifacts:
  files:
    - target/teashop-backend.war
    - Procfile
    - .ebextensions/**/*
    - .platform/**/*
  discard-paths: no